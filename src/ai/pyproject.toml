[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p06-ai"
version = "0.1.0"
description = "P06 Scheduling con AI - schema istanze, convertitori, generatore, baseline, teacher CP-SAT, dataset"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6,<3", "ortools>=9.10,<10"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# servizio HTTP del contratto B (p06_ai.service): uvicorn p06_ai.service:app --port 8000
service = ["fastapi>=0.110", "uvicorn>=0.29"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
