[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p06-ai"
version = "0.1.0"
description = "P06 Scheduling con AI - schema istanze, convertitori, generatore, baseline, teacher CP-SAT, dataset"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6,<3", "ortools>=9.10,<10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
