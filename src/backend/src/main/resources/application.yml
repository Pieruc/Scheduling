# FlowSync backend (Spring Boot 3.5, MySQL 8). Segreti e credenziali arrivano dall'ambiente.
spring:
  application:
    name: flowsync-backend
  config:
    # legge KEY=VALUE da .env nella cartella da cui si avvia l'app (src/backend); le variabili d'ambiente vincono
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:flowsync}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC
    username: ${DB_USER:flowsync}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # lo schema lo crea SOLO Flyway; Hibernate controlla che le entità combacino
    properties:
      hibernate:
        jdbc:
          time_zone: UTC          # Instant <-> DATETIME(6) sempre in UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  docker:
    compose:
      enabled: false            # acceso solo nel profilo dev (sotto)

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"

flowsync:
  security:
    jwt:
      secret: ${JWT_SECRET}       # almeno 32 caratteri (HS256); in produzione solo da variabile d'ambiente
      access-ttl: PT15M           # contratto A.1: expiresIn = 900 s
      refresh-ttl: P7D
  ai:
    # servizio AI (contratto B): in locale "uvicorn p06_ai.service:app --port 8000" da src/ai
    base-url: ${AI_BASE_URL:http://localhost:8000}
    service-key: ${AI_SERVICE_KEY:}     # header X-Service-Key, se il servizio lo richiede
    time-limit-ms: 5000                # va nella ProblemSpec; l'attesa della risposta è time-limit + 2 s
    connect-timeout: PT2S
    retries: 1

---
# Profilo dev: dati di esempio (utenti demo, officina, commesse C-101…C-104) e valori di comodo.
# Password degli utenti demo: flowsync-dev. Da NON usare fuori dallo sviluppo.
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    password: ${DB_PASSWORD:flowsync}
  flyway:
    locations: classpath:db/migration,classpath:db/seed
    # Il seed è V100: su un DB di sviluppo che l'ha già applicato, una nuova migrazione (V7, V8, ...) ha un numero
    # più basso e Flyway la rifiuterebbe ("resolved migration not applied"). In dev la si applica dopo, fuori ordine.
    # Solo dev: in produzione il seed non c'è e l'ordine resta stretto.
    out-of-order: true
  docker:
    compose:
      enabled: true
      file: compose.yaml        # relativo alla cartella da cui parte l'app (src/backend)
      # avvia il container all'avvio e lo ferma (docker compose stop, i dati restano nel volume) alla chiusura
      # dell'app; serve una chiusura ordinata (Ctrl+C). Da VS Code lo ferma anche il postDebugTask di launch.json
      lifecycle-management: start-and-stop
flowsync:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
