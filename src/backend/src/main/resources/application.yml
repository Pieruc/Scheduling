# FlowSync backend (Spring Boot 3.5, MySQL 8). Segreti e credenziali arrivano dall'ambiente.
spring:
  application:
    name: flowsync-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:flowsync}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC
    username: ${DB_USER:flowsync}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # lo schema lo crea SOLO Flyway; Hibernate controlla che le entità combacino
    properties:
      hibernate:
        jdbc:
          time_zone: UTC          # Instant <-> DATETIME(6) sempre in UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"

flowsync:
  security:
    jwt:
      secret: ${JWT_SECRET}       # almeno 32 caratteri (HS256); in produzione solo da variabile d'ambiente
      access-ttl: PT15M           # contratto A.1: expiresIn = 900 s
      refresh-ttl: P7D

---
# Profilo dev: dati di esempio (utenti demo, officina, commesse C-101…C-104) e valori di comodo.
# Password degli utenti demo: flowsync-dev. Da NON usare fuori dallo sviluppo.
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    password: ${DB_PASSWORD:flowsync}
  flyway:
    locations: classpath:db/migration,classpath:db/seed
flowsync:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
